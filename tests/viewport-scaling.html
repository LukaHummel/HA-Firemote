<!doctype html>
<meta charset="utf-8">
<title>Firemote viewport scaling regression tests</title>
<style>body { margin: 0; overflow: hidden; }</style>
<pre id="results">Running…</pre>
<script type="module">
import '../custom_components/firemote_apps/frontend/HA-Firemote.js';
const assertions = [];
function check(condition, message) {
  if (!condition) throw new Error(message);
  assertions.push(message);
}
const config = { entity: 'none', device_family: 'amazon-fire', device_type: 'fire_tv_4_series' };
const card = document.createElement('firemote-card');
card.hass = { states: {}, entities: {}, config: { language: 'en' } };
async function configure(options) {
  card.setConfig({ ...config, ...options });
  await card.updateComplete;
  // Flush measurement synchronously so this also works in Chromium's virtual clock.
  card._updateViewportScale();
}
function size() {
  return card.shadowRoot.querySelector('.viewport-scale-container').getBoundingClientRect();
}
function checkFits(mode, percentage, width, height, message) {
  const targetWidth = mode === 'width' ? width * percentage / 100 : width;
  const targetHeight = mode === 'height' ? height * percentage / 100 : height;
  const remote = size();
  check(remote.width <= targetWidth + 1 && remote.height <= targetHeight + 1 &&
    (Math.abs(remote.width - targetWidth) < 1 || Math.abs(remote.height - targetHeight) < 1), message);
}
try {
  card.setConfig(config);
  document.body.append(card);
  await card.updateComplete;
  check(!card.shadowRoot.querySelector('.viewport-scale-container'), 'fixed scaling remains the default');
  for (const style of ['AF1', 'AF6', 'AR1', 'CC1', 'NS2', 'AL1', 'AL2']) {
    await configure({ scale_mode: 'viewport-height', scale: 90, defaultRemoteStyle_override: style,
      app_launch_1: 'netflix', visible_name_text: 'Living room', name_position: 'top' });
    checkFits('height', 90, innerWidth, innerHeight,
      `${style} fills its target height or available width without overflow`);
    const content = card._scaleContent;
    const natural = getComputedStyle(content);
    check(Math.abs(size().width / size().height - parseFloat(natural.width) / parseFloat(natural.height)) < 0.01,
      `${style} preserves proportions`);
    check(card.getCardSize() === Math.ceil(Math.max(innerHeight, size().height) / 50), `${style} reports centered layout masonry height`);
  }
  await configure({ defaultRemoteStyle_override: 'AL1', scale_mode: 'viewport-width', scale: 80 });
  checkFits('width', 80, innerWidth, innerHeight, 'width mode fills 80% width or available height without overflow');
  await configure({ scale_mode: 'viewport-width', scale: 10 });
  const previousHeight = size().height;
  await configure({ scale_mode: 'viewport-width', scale: 10, app_launch_1: 'netflix', app_launch_5: 'youtube', app_launch_6: 'netflix' });
  check(Math.abs(size().width - innerWidth * 0.1) < 1 && size().height > previousHeight,
    'added launcher rows update the scaled layout');
  await configure({ defaultRemoteStyle_override: 'AL1', scale_mode: 'viewport-width', scale: 80 });
  const originalWidth = Object.getOwnPropertyDescriptor(window, 'innerWidth');
  Object.defineProperty(window, 'innerWidth', { configurable: true, value: 600 });
  window.dispatchEvent(new Event('resize'));
  check(card._scaleFrame !== undefined, 'viewport resize schedules a scale update');
  card._updateViewportScale();
  checkFits('width', 80, 600, innerHeight, 'resized viewport recomputes the fitting dimensions');
  await configure({ scale: 85, scale_mode: 'fixed' });
  check(!card._scaleContent && !card.shadowRoot.querySelector('.viewport-scale-container'), 'switching to fixed removes scaling wrapper');
  await configure({ scale_mode: 'viewport-height' });
  check(Math.abs(size().height - innerHeight) < 1, 'omitted percentage defaults to 100');
  card.remove();
  check(!card._scaleObserver && card._scaleFrame === undefined, 'disconnect releases observer and animation frame');
  document.body.append(card);
  await card.updateComplete;
  // Reconnection must observe the existing content even without a new Lit update.
  card._updateViewportScale();
  check(card._scaleContent !== undefined, 'reconnection restores scaling');
  // Simulate the HA dashboard shell across a shadow boundary. The view
  // includes header padding and is offset by the open sidebar.
  Object.defineProperty(window, 'innerWidth', originalWidth);
  const dashboard = document.createElement('hui-root');
  const dashboardRoot = dashboard.attachShadow({ mode: 'open' });
  dashboardRoot.innerHTML = `
    <div class="header" style="position:fixed;left:200px;right:0;top:0;height:64px"></div>
    <div id="view" style="position:fixed;left:200px;right:0;top:0;bottom:0;
      box-sizing:border-box;padding:64px 20px 16px 12px"></div>`;
  document.body.append(dashboard);
  dashboardRoot.querySelector('#view').append(card);
  await card.updateComplete;
  await configure({ scale_mode: 'viewport-height', scale: 100 });
  check(Math.abs(size().height - (innerHeight - 80)) < 1,
    'height excludes the dashboard header and bottom padding across shadow roots');
  await configure({ defaultRemoteStyle_override: 'AL1', scale_mode: 'viewport-width', scale: 100 });
  checkFits('width', 100, innerWidth - 232, innerHeight - 80,
    'width excludes the open sidebar and dashboard horizontal padding');
  dashboardRoot.querySelector('#view').style.left = '0px';
  card._updateViewportScale();
  check(Math.abs(card._visibleDashboardSize().width - (innerWidth - 32)) < 1,
    'closing the sidebar expands the available dashboard width');
  checkFits('width', 100, innerWidth - 32, innerHeight - 80, 'sidebar changes preserve fitting constraints');
  dashboardRoot.querySelector('.header').style.height = '96px';
  dashboardRoot.querySelector('#view').style.paddingTop = '96px';
  await configure({ scale_mode: 'viewport-height', scale: 90 });
  check(Math.abs(size().height - (innerHeight - 112) * 0.9) < 1,
    'header changes are included in percentage scaling');
  function checkCentered(message) {
    const frame = card.shadowRoot.querySelector('.viewport-scale-frame').getBoundingClientRect();
    const remote = size();
    check(Math.abs(remote.left + remote.width / 2 - (frame.left + frame.width / 2)) < 1 &&
      Math.abs(remote.top + remote.height / 2 - (frame.top + frame.height / 2)) < 1, message);
  }
  checkCentered('height-scaled remote is centered horizontally and vertically');
  check(Math.abs(size().top - (96 + (innerHeight - 112) * 0.05)) < 1,
    'vertical centering leaves equal space below the header and above bottom padding');
  await configure({ scale_mode: 'viewport-width', scale: 10 });
  checkCentered('width-scaled remote is centered horizontally and vertically');
  const viewBounds = dashboardRoot.querySelector('#view').getBoundingClientRect();
  check(Math.abs(size().left + size().width / 2 - (viewBounds.left + 12 + (viewBounds.width - 32) / 2)) < 1,
    'horizontal centering respects dashboard padding');
  await configure({ scale_mode: 'viewport-height', scale: 150 });
  check(size().top >= 96, 'oversized cards remain reachable below the header');
  check(card.getCardSize() === Math.ceil(size().height / 50), 'oversized cards report their full layout height');
  const stableHeight = size().height;
  for (let i = 0; i < 5; i++) card._updateViewportScale();
  check(Math.abs(size().height - stableHeight) < 0.01,
    'repeated dashboard measurements do not feed back into scaling');
  // Some dashboard layouts overlay the fixed header instead of reserving
  // its height in #view. Scaling must position the card as well as size it.
  const view = dashboardRoot.querySelector('#view');
  view.style.paddingTop = '0px';
  await configure({ defaultRemoteStyle_override: 'AL2', scale_mode: 'viewport-height', scale: 100 });
  check(size().top >= 96, 'overlaid header leaves the complete card below the toolbar');
  check(size().bottom <= innerHeight - 16 + 1,
    'overlaid header layout fits between toolbar and dashboard bottom padding');
  await configure({ defaultRemoteStyle_override: 'AL2', scale_mode: 'viewport-width', scale: 100 });
  check(size().top >= 96 && size().bottom <= innerHeight - 16 + 1,
    'AL2 at 100% width fits fully below the toolbar without vertical scrolling');
  check(size().width <= innerWidth - 32 + 1, 'height constraint preserves the available dashboard width');
  const overlayTop = size().top;
  for (let i = 0; i < 5; i++) card._updateViewportScale();
  check(Math.abs(size().top - overlayTop) < 1, 'header clearance remains stable across repeated measurements');
  view.style.overflow = 'auto';
  await configure({ defaultRemoteStyle_override: 'AL2', scale_mode: 'viewport-height', scale: 150 });
  view.scrollTop = 40;
  const scrolledTop = size().top;
  const scrolledHeight = size().height;
  card._updateViewportScale();
  check(Math.abs(size().top - scrolledTop) < 1 && Math.abs(size().height - scrolledHeight) < 1,
    'resizing a scrolled dashboard does not add clearance repeatedly or change scale');
  view.scrollTop = 0;
  view.style.overflow = '';
  view.style.paddingTop = '96px';
  card.style.marginTop = '24px';
  await configure({ scale_mode: 'viewport-height', scale: 100 });
  check(Math.abs(size().top - 120) < 1 && Math.abs(size().bottom - (innerHeight - 16)) < 1,
    'space above the card is excluded so its bottom remains within the dashboard');
  card.style.marginTop = '';
  await configure({ scale_mode: 'viewport-height', scale: 100 });
  check(Math.abs(size().top - 96) < 1, 'dashboard padding is not counted twice');
  // Exercise actual image loading and layout with both APK icons and TV banners.
  const imageURL = (width, height) => 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}"><rect width="100%" height="100%" fill="red"/></svg>`);
  card.hass = { ...card.hass, states: { 'sensor.apps': { state: '2', attributes: {
    firemote_entity: 'none', apps: [
      { id: 'banner', name: 'TV banner', icon: imageURL(320, 180) },
      { id: 'square', name: 'Square icon', icon: imageURL(96, 96) },
    ],
  } } } };
  const imageLaunchers = { app_launch_1: 'source:banner', app_launch_2: 'source:square' };
  function paintedSize(image) {
    const bounds = image.getBoundingClientRect();
    const factor = Math.min(bounds.width / image.naturalWidth, bounds.height / image.naturalHeight);
    return { width: image.naturalWidth * factor, height: image.naturalHeight * factor };
  }
  for (const style of ['AF6', 'AL1', 'AL2', 'NS2', 'AR1', 'CC1', 'HO1']) {
    let previous;
    for (const scale of [50, 100, 200]) {
      await configure({ ...imageLaunchers, defaultRemoteStyle_override: style, scale_mode: 'fixed', scale });
      const images = [...card.shadowRoot.querySelectorAll('.deviceAppIcon')];
      check(images.length === 2, `${style} renders both discovered app images`);
      await Promise.all(images.map(image => image.decode()));
      const [banner, square] = images.map(paintedSize);
      for (const image of images) {
        const bounds = image.getBoundingClientRect();
        const button = image.parentElement.getBoundingClientRect();
        check(bounds.left >= button.left && bounds.right <= button.right &&
          bounds.top >= button.top && bounds.bottom <= button.bottom,
          `${style} ${scale}% image artwork fits within its launcher`);
        check(getComputedStyle(image).objectFit === 'contain', `${style} preserves image proportions`);
        check(image.nextElementSibling.hidden, `${style} loaded icons hide fallback labels`);
      }
      const button = images[0].parentElement.getBoundingClientRect();
      check(banner.width > button.width * 0.45, `${style} ${scale}% TV banners use the launcher width`);
      check(square.height > button.height * 0.65, `${style} ${scale}% square icons use the launcher height`);
      if (previous) check(Math.abs(banner.width / previous.width - 2) < 0.01 &&
        Math.abs(square.height / previous.height - 2) < 0.01, `${style} image artwork scales with fixed percentage`);
      previous = { width: banner.width, height: square.height };
    }
  }
  let previousImages;
  for (const scale of [10, 20]) {
    await configure({ ...imageLaunchers, defaultRemoteStyle_override: 'AL2', scale_mode: 'viewport-width', scale });
    const images = [...card.shadowRoot.querySelectorAll('.deviceAppIcon')];
    await Promise.all(images.map(image => image.decode()));
    const sizes = images.map(paintedSize);
    if (previousImages) check(sizes.every((value, i) =>
      Math.abs(value.width / previousImages[i].width - 2) < 0.01 &&
      Math.abs(value.height / previousImages[i].height - 2) < 0.01),
      'TV banners and square icons scale proportionally with viewport percentage');
    previousImages = sizes;
  }
  const editor = document.createElement('firemote-card-editor');
  editor.hass = card.hass;
  editor.setConfig(config);
  document.body.append(editor);
  await editor.updateComplete;
  const selector = editor.shadowRoot.querySelector('#scale_mode');
  check(selector.value === 'fixed', 'editor defaults to fixed mode');
  let changed;
  editor.addEventListener('config-changed', event => { changed = event.detail.config; });
  selector.value = 'viewport-width';
  selector.dispatchEvent(new Event('change'));
  check(changed.scale_mode === 'viewport-width', 'editor saves viewport mode');
  editor.remove();
  card.remove();
  dashboard.remove();
  document.querySelector('#results').textContent = JSON.stringify({ status: 'passed', assertions });
} catch (error) {
  document.querySelector('#results').textContent = JSON.stringify({ status: 'failed', error: error.stack, assertions });
}
</script>
