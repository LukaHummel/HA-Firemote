<!doctype html>
<meta charset="utf-8">
<title>Firemote performance regression tests</title>
<pre id="results">Running…</pre>
<script type="module">
import '../custom_components/firemote_apps/frontend/HA-Firemote.js';
import { devices } from '../dist/supported-devices.js';

const results = document.querySelector('#results');
const assertions = [];
function check(condition, message) {
  if (!condition) throw new Error(message);
  assertions.push(message);
}
const state = (name, value = 'on') => ({ state: value, attributes: { friendly_name: name, app_id: 'com.netflix.ninja', source_list: ['YouTube', 'SecondApp'] } });
const config = { entity: 'media_player.tv', device_family: 'amazon-fire', device_type: 'fire_tv_4_series', app_launch_1: 'source:YouTube' };
const registry = { 'media_player.tv': { platform: 'androidtv' }, 'remote.tv': { platform: 'androidtv_remote' } };
const hass = { config: { language: 'en' }, entities: registry,
  states: { 'media_player.tv': state('TV'), 'remote.tv': state('Remote'), 'sensor.other': state('Sensor') } };
async function mount(tag, conf = config, ha = hass) {
  const element = document.createElement(tag);
  element.hass = ha;
  element.setConfig(conf);
  let renders = 0;
  const render = element.render;
  element.render = function () { renders++; return render.call(this); };
  element.renderCount = () => renders;
  document.body.append(element);
  await element.updateComplete;
  return element;
}
try {
  const card = await mount('firemote-card');
  const editor = await mount('firemote-card-editor');
  check(card.shadowRoot.querySelector('ha-card'), 'card mounts with real Lit rendering');
  check(editor.shadowRoot.querySelector('#app_launch_1').value === 'source:YouTube', 'initial launcher selection is retained');
  for (let i = 0; i < 100; i++) {
    const next = { ...hass, states: { ...hass.states, 'sensor.other': state('Sensor', String(i)) } };
    card.hass = next;
    editor.hass = next;
    await Promise.all([card.updateComplete, editor.updateComplete]);
  }
  check(card.renderCount() === 1 && editor.renderCount() === 1, 'unrelated HA updates do not render card or editor');
  const playing = { ...hass, states: { ...hass.states, 'media_player.tv': state('TV', 'playing') } };
  card.hass = playing;
  editor.hass = playing;
  await Promise.all([card.updateComplete, editor.updateComplete]);
  check(card.renderCount() === 2 && editor.renderCount() === 1, 'playback updates render the card, not the editor');
  editor.hass = { ...hass, states: { ...hass.states, 'media_player.tv': state('Renamed TV') } };
  await editor.updateComplete;
  check(editor.shadowRoot.querySelector('#entity').textContent.includes('Renamed TV'), 'friendly name changes refresh entity choices');
  let events = 0;
  editor.addEventListener('config-changed', () => events++);
  const select = editor.shadowRoot.querySelector('#app_launch_1');
  select.dispatchEvent(new Event('change'));
  select.dispatchEvent(new Event('focusout'));
  check(events === 0, 'unchanged selections do not emit config-changed');
  select.value = 'source:SecondApp';
  select.dispatchEvent(new Event('change'));
  await editor.updateComplete;
  check(events === 1 && editor._config.app_launch_1 === 'source:SecondApp', 'a changed selection emits once and updates config');
  check(config.app_launch_1 === 'source:YouTube', 'editing does not mutate the supplied config');
  const name = editor.shadowRoot.querySelector('#visible_name_text');
  name.value = 'Living room';
  name.dispatchEvent(new Event('keyup'));
  name.dispatchEvent(new Event('change'));
  name.dispatchEvent(new Event('focusout'));
  await editor.updateComplete;
  check(events === 2, 'keyup, change and focusout emit only one change for the same text');
  editor.setConfig({ ...config, defaultRemoteStyle_override: 'AL2' });
  await editor.updateComplete;
  check(editor.shadowRoot.querySelectorAll('select[name^="app_launch_"]').length === 6, 'launcher-only editor starts with six slots');
  const spare = editor.shadowRoot.querySelector('#app_launch_6');
  spare.value = 'source:YouTube';
  spare.dispatchEvent(new Event('change'));
  await editor.updateComplete;
  check(editor.shadowRoot.querySelector('#app_launch_7'), 'selecting the final slot adds a spare');
  check(editor.shadowRoot.querySelector('#app_launch_6').value === 'source:YouTube', 'selection survives adding a slot');
  editor.setConfig({ ...config, defaultRemoteStyle_override: 'AL1', app_launch_25: 'source:YouTube' });
  await editor.updateComplete;
  check(editor.shadowRoot.querySelector('#app_launch_25').value === 'source:YouTube' && editor.shadowRoot.querySelector('#app_launch_26'), 'sparse existing slots are preserved with a spare');
  editor.setConfig({ ...config, custom_launchers: [{ label: 'Cinema', script: 'cinema' }], app_launch_1: 'customlauncher Cinema' });
  await editor.updateComplete;
  const other = await mount('firemote-card-editor', { ...config, custom_launchers: [{ label: 'Music', script: 'music' }] });
  check(!other.shadowRoot.querySelector('option[value="customlauncher Music"]') && !editor.shadowRoot.querySelector('option[value="customlauncher Cinema"]'), 'custom launchers are excluded from device app choices');
  editor.hass = { ...hass, config: { language: 'fr' } };
  await editor.updateComplete;
  check(!editor.shadowRoot.querySelector('option[value="customlauncher Cinema"]'), 'language updates do not reintroduce custom options');
  editor.setConfig({ ...config, defaultRemoteStyle_override: 'CC1' });
  await editor.updateComplete;
  const media = editor.shadowRoot.querySelector('#showMediaControlsCheckbox');
  media.checked = true;
  media.dispatchEvent(new Event('change'));
  await editor.updateComplete;
  check(editor._config.show_media_controls === true, 'checkbox config remains boolean');
  const family = editor.shadowRoot.querySelector('#device_family');
  family.value = 'none';
  family.dispatchEvent(new Event('change'));
  await editor.updateComplete;
  check(editor._config.entity === 'none' && editor._config.device_type === 'other', 'button-only family is saved without render-time event side effects');
  const associated = await mount('firemote-card', { ...config, device_family: 'chromecast', android_tv_remote_entity: 'remote.tv' });
  const before = associated.renderCount();
  associated.hass = { ...hass, states: { ...hass.states, 'remote.tv': state('Remote', 'off') } };
  await associated.updateComplete;
  check(associated.renderCount() === before + 1, 'associated remote updates are rendered');
  associated.hass = { ...hass, states: { 'media_player.tv': hass.states['media_player.tv'] } };
  await associated.updateComplete;
  check(associated.shadowRoot.querySelector('ha-card'), 'missing associated remote does not break rendering');
  editor.hass = { ...hass, states: {} };
  editor.setConfig(config);
  await editor.updateComplete;
  check(!editor.shadowRoot.querySelector('#entity option[value="media_player.tv"]'), 'missing registry states are excluded safely');
  const calls = [];
  const launcherConfig = { ...config, app_launch_1: 'customlauncher Cinema', custom_launchers: [{ label: 'Cinema', script: 'cinema' }] };
  const launcherCard = await mount('firemote-card', launcherConfig, { ...hass, callService: () => { throw new Error('stale hass'); } });
  const otherCard = await mount('firemote-card', { ...launcherConfig, custom_launchers: [{ label: 'Cinema', script: 'other_cinema' }] }, { ...hass, callService: (...args) => calls.push(args) });
  launcherCard.hass = { ...hass, callService: (...args) => calls.push(args) };
  await launcherCard.updateComplete;
  launcherCard.shadowRoot.getElementById('customlauncher Cinema-button').click();
  otherCard.shadowRoot.getElementById('customlauncher Cinema-button').click();
  check(launcherCard.renderCount() === 1 && calls[0]?.[1] === 'cinema' && calls[1]?.[1] === 'other_cinema', 'button actions use latest hass and isolated launcher catalogs without re-rendering');
  launcherCard.setConfig({ ...launcherConfig, custom_launchers: [{ label: 'Cinema', script: 'updated_cinema' }] });
  await launcherCard.updateComplete;
  launcherCard.shadowRoot.getElementById('customlauncher Cinema-button').click();
  check(calls[2]?.[1] === 'updated_cinema', 'config changes invalidate command catalogs');
  editor.hass = { ...hass, entities: { ...registry, 'media_player.new_tv': { platform: 'androidtv' } },
    states: { ...hass.states, 'media_player.new_tv': state('New TV') } };
  await editor.updateComplete;
  check(editor.shadowRoot.querySelector('#entity option[value="media_player.new_tv"]'), 'registry changes refresh cached platform choices');
  const discoveredHass = { ...hass, callService: (...args) => calls.push(args),
    states: { ...hass.states, 'media_player.tv': { ...state('TV'), attributes: {
      source_list: ['Unknown & <App>', 'New app', 'New app', '', null]
    } } } };
  const discoveredConfig = { ...config, app_launch_1: '', app_launch_2: 'netflix', custom_launchers: [{ label: 'Legacy', script: 'legacy' }] };
  const discovered = await mount('firemote-card', discoveredConfig, discoveredHass);
  const discoveredEditor = await mount('firemote-card-editor', discoveredConfig, discoveredHass);
  const choices = discoveredEditor.shadowRoot.querySelector('#app_launch_1');
  check(choices.options.length === 3 && choices.options[1].textContent === 'Unknown & <App>', 'dropdown offers unique device apps with safely rendered labels');
  check(![...discovered.shadowRoot.querySelectorAll('.srcButton')].some(button => button.textContent === 'Unknown & <App>'), 'discovered apps do not appear on the remote before selection');
  check(!choices.querySelector('option[value="netflix"]') && !choices.querySelector('option[value="customlauncher Legacy"]'), 'saved hardcoded and custom options are excluded');
  check(!choices.querySelector('option[value="youtube"]'), 'static catalog is not offered in app choices');
  choices.value = 'source:' + encodeURIComponent('Unknown & <App>');
  choices.dispatchEvent(new Event('change'));
  await discoveredEditor.updateComplete;
  discovered.setConfig(discoveredEditor._config);
  await discovered.updateComplete;
  const selectedButton = discovered.shadowRoot.querySelector('.srcButton:not(.hidden)');
  check(selectedButton.textContent === 'Unknown & <App>', 'only the selected discovered app appears on the remote');
  selectedButton.click();
  check(calls.at(-1)[1] === 'select_source' && calls.at(-1)[2].source === 'Unknown & <App>', 'selected device app launches with its original source');
  discoveredEditor.hass = { ...discoveredHass, states: { ...hass.states,
    'media_player.tv': { ...state('TV'), attributes: { source_list: ['Replacement'] } } } };
  await discoveredEditor.updateComplete;
  check(discoveredEditor.shadowRoot.querySelector('#app_launch_1').textContent.includes('Replacement'), 'app choices refresh when the device list changes');
  const catalogState = { state: '1', attributes: { firemote_entity: config.entity,
    apps: [{ id: 'com.example.cinema', name: 'Cinema Room', icon: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l9sAAAAASUVORK5CYII=' }] } };
  const catalogHass = { ...discoveredHass, states: { ...discoveredHass.states, 'sensor.firemote_apps': catalogState } };
  discoveredEditor.hass = catalogHass;
  await discoveredEditor.updateComplete;
  const appSelect = discoveredEditor.shadowRoot.querySelector('#app_launch_1');
  check(appSelect.options.length === 2 && appSelect.options[1].textContent === 'Cinema Room', 'companion catalog replaces raw sources with installed app display names');
  appSelect.value = 'source:com.example.cinema';
  appSelect.dispatchEvent(new Event('change'));
  await discoveredEditor.updateComplete;
  discovered.hass = catalogHass;
  discovered.setConfig({ ...discoveredEditor._config, app_launch_2: '' });
  await discovered.updateComplete;
  const iconButton = discovered.shadowRoot.querySelector('.srcButton:not(.hidden)');
  check(iconButton.textContent === 'Cinema Room' && iconButton.querySelector('img'), 'selected app renders its resolved name and device icon');
  const loadedIcon = iconButton.querySelector('img');
  if (!loadedIcon.complete) await new Promise(resolve => {
    loadedIcon.addEventListener('load', resolve, { once: true });
    loadedIcon.addEventListener('error', resolve, { once: true });
  });
  check(loadedIcon.naturalWidth > 0 && !loadedIcon.hidden, 'device icon actually decodes and remains visible');
  iconButton.click();
  check(calls.at(-1)[2].source === 'com.example.cinema', 'resolved names do not replace the package ID used for launching');
  discovered.setConfig({ ...discoveredEditor._config, app_launch_1: 'source:Cinema%20Room', app_launch_2: '' });
  await discovered.updateComplete;
  const aliasButton = discovered.shadowRoot.querySelector('.srcButton:not(.hidden)');
  check(aliasButton.querySelector('img'), 'name-based selections made before backend installation resolve their icons');
  aliasButton.click();
  check(calls.at(-1)[2].source === 'com.example.cinema', 'name-based selection resolves to the correct package ID when launching');
  discoveredEditor.setConfig({ ...discoveredEditor._config, app_launch_1: 'source:Cinema%20Room' });
  await discoveredEditor.updateComplete;
  check(discoveredEditor.shadowRoot.querySelector('#app_launch_1').value === 'source:com.example.cinema', 'editor retains name-based selections when the backend supplies package IDs');
  discovered.setConfig({ ...discoveredEditor._config, app_launch_1: 'source:com.example.cinema', app_launch_2: '' });
  discoveredEditor.setConfig({ ...discoveredEditor._config, app_launch_1: 'source:com.example.cinema' });
  const updatedCatalogHass = { ...catalogHass, states: { ...catalogHass.states,
    'sensor.firemote_apps': { ...catalogState, attributes: { ...catalogState.attributes,
      apps: [{ id: 'com.example.cinema', name: 'Renamed Cinema' }] } } } };
  discovered.hass = updatedCatalogHass;
  discoveredEditor.hass = updatedCatalogHass;
  await Promise.all([discovered.updateComplete, discoveredEditor.updateComplete]);
  check(discovered.shadowRoot.querySelector('.srcButton:not(.hidden)').textContent === 'Renamed Cinema' &&
    discoveredEditor.shadowRoot.querySelector('#app_launch_1').selectedOptions[0].textContent === 'Renamed Cinema', 'sensor-only changes refresh names on both remote and editor');
  discoveredEditor.hass = { ...catalogHass, states: { ...catalogHass.states,
    'sensor.firemote_apps': { ...catalogState, state: 'unavailable' } } };
  await discoveredEditor.updateComplete;
  check(discoveredEditor.shadowRoot.querySelector('#app_launch_1').options.length === 1, 'unavailable installed-app catalog does not substitute running apps');
  discovered.remove();
  discoveredEditor.remove();
  let models = 0;
  for (const [family, data] of Object.entries(devices)) {
    for (const [category, entries] of Object.entries(data)) {
      if (category === 'meta') continue;
      for (const [model, attrs] of Object.entries(entries)) {
        if (!attrs.supported) continue;
        card.setConfig({ ...config, device_family: family, device_type: model });
        await card.updateComplete;
        check(card.shadowRoot.querySelector('ha-card'), `device renders: ${model}`);
        models++;
      }
    }
  }
  results.textContent = JSON.stringify({ status: 'passed', assertions: assertions.length, models, checks: assertions }, null, 2);
} catch (error) {
  results.textContent = JSON.stringify({ status: 'failed', error: error.stack, checks: assertions }, null, 2);
}
</script>
