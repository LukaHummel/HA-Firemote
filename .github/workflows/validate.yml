name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"

  bundle:
    name: Bundled integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/bundle.py --check
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  frontend:
    name: Frontend regressions
    runs-on: ubuntu-latest
    env:
      CHROMIUM_BIN: google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/run.mjs
          node tests/run-viewport-scaling.mjs
          node tests/run.mjs catalog-layout.html
          node tests/run.mjs editor.html
          node tests/run.mjs commands.html

  setup-flow:
    name: Home Assistant setup flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tests/requirements-setup.txt
      - run: python3 -m unittest discover -s tests -p 'test_config_flow.py'

  runtime-dependencies:
    name: Runtime dependencies on Python 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the manifest dependencies without source builds
        run: |
          python - <<'PYTHON'
          import json
          import subprocess
          import sys
          from pathlib import Path
          manifest = json.loads(Path('custom_components/firemote_apps/manifest.json').read_text())
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--only-binary=:all:', *manifest['requirements'], 'Pillow'])
          PYTHON
      - run: python -c "from pyaxmlparser import APK; from PIL import Image"
      - run: python -m unittest discover -s tests -p 'test_app_catalog.py'
